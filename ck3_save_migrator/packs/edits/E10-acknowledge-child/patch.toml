help = "Makes a child born outside the marriage the legitimate child of the mother's husband (or former husband). The child joins his children and loses the bastard and wild oat traits. The save keeps the real father, as the game does for any child whose father in law is not the father in blood. Choose the past: honest keeps the truth as the game's disputed heritage secret, which others can discover in play (exposing it costs opinion and legitimacy, not inheritance); clean removes the secret, so the truth stays only in the save. The child's house is not changed. A legitimate son may now come before his younger siblings in the line of succession."

